name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.16.0 check .

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --wheel

  vtk-tools:
    name: Build VTK tools & run tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          channels: conda-forge
          channel-priority: strict
          auto-activate-base: false

      - name: Install system dependencies
        shell: bash -l {0}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yq \
            build-essential \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libsm-dev \
            libx11-dev \
            libxt-dev \
            libxext-dev
          sudo ln -sv /usr/lib/x86_64-linux-gnu /usr/lib64

      - name: Install Python and conda dependencies
        shell: bash -l {0}
        run: |
          conda install -y \
            cmake \
            "vtk=9.3" \
            "libboost=1.86.0" \
            "libboost-devel=1.86.0" \
            "libboost-headers=1.86.0" \
            eigen \
            mesalib \
            pandas \
            matplotlib \
            colormath \
            nipype \
            nose \
            etelemetry \
            tbb-devel
          python -m pip install --no-build-isolation .

      - name: Build VTK C++ tools
        shell: bash -l {0}
        run: |
          mkdir -p vtk_cpp_tools/bin
          cd vtk_cpp_tools/bin
          cmake ../
          make -j2

      - name: Run current tests
        shell: bash -l {0}
        env:
          MB: ${{ github.workspace }}/src/mindboggle
        run: |
          export PATH="$PATH:${{ github.workspace }}/vtk_cpp_tools/bin"
          python -m nose --with-doctest "$MB/thirdparty/"
          python -m nose --with-doctest "$MB/mio/"
          python -m nose --with-doctest "$MB/guts/"
          python -m nose --with-doctest "$MB/shapes/"
          python -m nose --with-doctest "$MB/features/"
